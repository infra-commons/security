name: Capture security findings on merge
description: >-
  Reviews the diff of a single merge to the default branch and files each
  non-suppressed HIGH/MEDIUM/LOW finding as a tracked GitHub Issue. The
  per-merge catch-all for findings the PR gate (CRITICAL-only) lets through.

inputs:
  api-key:
    description: "Anthropic API key"
    required: true
  github-token:
    description: "GitHub token with issues:write"
    required: true
  repo:
    description: "owner/repo slug"
    required: true
  before-sha:
    description: "Commit SHA before the push (github.event.before)"
    required: true
  after-sha:
    description: "Commit SHA after the push (github.event.after)"
    required: true
  run-url:
    description: "URL of the current workflow run"
    required: true
  severity-floor:
    description: >-
      Lowest severity (CRITICAL|HIGH|MEDIUM|LOW) that gets an individual
      GitHub Issue; findings below it roll into the rolling MEDIUM/LOW digest
      instead. Empty defaults to HIGH (CRITICAL+HIGH individual, MEDIUM+LOW
      digest — the historical behaviour).
    required: false
    default: ""
  board-app-token:
    description: >-
      App installation token, used for two things. (1) `organization_projects: write` adds a newly
      filed CRITICAL or HIGH finding to the org's GitHub Project Inbox (infra-commons/meta#661;
      CRITICAL added after the operator overrode #661's HIGH-only scoping) — `github-token`
      above cannot do this itself, because org-level Projects v2 mutations need an App/PAT token,
      which no `permissions:` block can grant to a default Actions token. (2) `pull_requests: read`
      is the FALLBACK credential for reading the PR-time reviewers' comments
      (infra-commons/meta#1187), tried only after `github-token`; the job token is capped by the
      caller's own `permissions:` block and typically cannot read pull requests. Empty by default —
      a newly-filed CRITICAL/HIGH just isn't board-added, and PR-comment reads fall back to
      commit-subject resolution. Deliberately NOT renamed despite now serving both: the composite
      ships on a moving tag while the reusable is SHA-pinned per caller, so
      old-reusable/new-composite and new-reusable/old-composite must both keep working.
    required: false
    default: ""
  ingest-pr-reviews:
    description: >-
      Set "false" to disable ingesting findings from the PR-time adversarial-review comments
      (infra-commons/meta#1187) and review only the merged diff, as this action did before. Any
      other value leaves the ingest on. An escape hatch for a caller hit by reviewer format drift;
      turning it off restores the single-model gap the ingest exists to close.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Full history so the script can diff before...after.
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      shell: bash
      run: pip install anthropic==0.49.0 httpx==0.28.1 pyyaml==6.0.2

    - name: Capture findings from the merged diff
      shell: bash
      env:
        REVIEW_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        BEFORE_SHA: ${{ inputs.before-sha }}
        AFTER_SHA: ${{ inputs.after-sha }}
        RUN_URL: ${{ inputs.run-url }}
        INDIVIDUAL_SEVERITY_FLOOR: ${{ inputs.severity-floor }}
        BOARD_APP_TOKEN: ${{ inputs.board-app-token }}
        INGEST_PR_REVIEWS: ${{ inputs.ingest-pr-reviews }}
      run: python "$GITHUB_ACTION_PATH/capture.py"
