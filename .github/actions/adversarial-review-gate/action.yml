name: Adversarial review gate
description: >-
  Combines the adversarial reviewer jobs' outcomes into a three-state gate
  result (clear / degraded / blocked) and fails the step when it blocks.

inputs:
  claude-result:
    description: "needs.<claude job>.result"
    required: true
  claude-has-critical:
    description: "needs.<claude job>.outputs.has_critical"
    required: false
    default: ""
  claude-outcome:
    description: "needs.<claude job>.outputs.outcome"
    required: false
    default: ""
  openai-result:
    description: "needs.<openai job>.result"
    required: false
    default: "skipped"
  openai-has-critical:
    description: "needs.<openai job>.outputs.has_critical"
    required: false
    default: ""
  openai-outcome:
    description: "needs.<openai job>.outputs.outcome"
    required: false
    default: ""
  run-openai:
    description: "Whether the OpenAI reviewer was asked to run"
    required: false
    default: "false"
  is-fork:
    description: "Whether the PR head is a fork (reviewers cannot see secrets)"
    required: false
    default: "false"
  is-dependabot:
    description: "Whether the PR author is Dependabot"
    required: false
    default: "false"
  quota-marker-open:
    description: >-
      Whether a tracking issue for a previous quota-exhausted run is still open
      in this repo. This is the durable memory behind "fail open once, then
      block": with it false the first quota-exhausted PR degrades and passes,
      with it true a subsequent one is blocked rather than merged unreviewed.
      Defaults to "false", which is the safe default for a caller that has not
      wired the lookup — it preserves today's fail-open behaviour rather than
      blocking on a signal the caller never supplies.
    required: false
    default: "false"

outputs:
  result:
    description: "clear | degraded | blocked | not-required"
    value: ${{ steps.evaluate.outputs.result }}
  reason:
    description: "Machine-readable reason for the result"
    value: ${{ steps.evaluate.outputs.reason }}
  degraded:
    description: "true when the gate passed with fewer reviewers than configured"
    value: ${{ steps.evaluate.outputs.degraded }}
  unavailable:
    description: "Comma-separated reviewers that were asked to run and produced no verdict"
    value: ${{ steps.evaluate.outputs.unavailable }}
  quota_exhausted:
    description: >-
      true when a reviewer reported its provider budget exhausted. The caller
      uses this to open (or keep open) the tracking issue that becomes the next
      run's `quota-marker-open`.
    value: ${{ steps.evaluate.outputs.quota_exhausted }}

runs:
  using: composite
  steps:
    # No checkout and no pip install: the script is stdlib-only and lives in
    # this action's own directory. The gate is the last thing standing between
    # a review and a merge, so it depends on as little as possible.
    - name: Evaluate adversarial review outcomes
      id: evaluate
      shell: bash
      env:
        CLAUDE_RESULT: ${{ inputs.claude-result }}
        CLAUDE_HAS_CRITICAL: ${{ inputs.claude-has-critical }}
        CLAUDE_OUTCOME: ${{ inputs.claude-outcome }}
        OPENAI_RESULT: ${{ inputs.openai-result }}
        OPENAI_HAS_CRITICAL: ${{ inputs.openai-has-critical }}
        OPENAI_OUTCOME: ${{ inputs.openai-outcome }}
        RUN_OPENAI: ${{ inputs.run-openai }}
        IS_FORK: ${{ inputs.is-fork }}
        IS_DEPENDABOT: ${{ inputs.is-dependabot }}
        QUOTA_MARKER_OPEN: ${{ inputs.quota-marker-open }}
      run: python3 "$GITHUB_ACTION_PATH/gate.py"
