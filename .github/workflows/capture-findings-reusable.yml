name: Capture security findings (reusable)

# Reusable post-merge findings capture. Files CRITICAL/HIGH/MEDIUM/LOW findings as
# tracked GitHub Issues — complementing the CRITICAL gate that runs at PR time.
#
# "Complementing", not "duplicating": this runs AFTER the merge, so any CRITICAL it
# files as a new issue is one the PR-time gate did not block. That is why CRITICALs
# are board-added here too — see BOARD_ADD_SEVERITIES in capture.py.
#
# Findings come from TWO sources, merged into one deduplicated set:
#
#   1. The PR-time adversarial-review comments already on the merged PR — BOTH
#      reviewers (Anthropic and OpenAI), at no additional model spend.
#   2. This workflow's own post-merge review pass over the merged diff (Anthropic).
#
# Source 1 exists because of infra-commons/meta#1187: the PR-time gate runs two
# models and this capture ran one, so a HIGH that only the OpenAI reviewer raised —
# and, per klsjapan-com/nutrition-tracker#228, even one BOTH reviewers agreed on —
# became a tracked issue only if the single post-merge model happened to rediscover
# it. Reading what the reviewers already wrote is the fix; a second post-merge model
# would only have bought a second lottery ticket, at double the spend.
#
# Reviews only the merged diff (before...after) — never the full codebase —
# so a given diff is reviewed exactly once and findings on unchanged code
# are never re-sampled.
#
# Caller pattern (trigger on push to main):
#
#   on:
#     push:
#       branches: [main]
#
#   # NO `concurrency:` block. This pattern carried one until 2026-09-03 and every caller
#   # copied it; it silently discarded whole merges. `cancel-in-progress: false` does NOT
#   # mean "queue everything" — GitHub permits exactly one PENDING run per group and
#   # CANCELS the previously pending one when a newer run arrives. Capture is `on: push`,
#   # so a burst of merges cancels the runs in the middle of the burst.
#   #
#   # A cancelled run has ZERO jobs: no receipt, no issue, no red — the "never ran" state
#   # the capture receipt exists to expose, arriving by the one route the receipt cannot
#   # reach. And the loss is permanent, because run N would have reviewed
#   # before_N..after_N while run N+1 reviews after_N..after_{N+1}: the skipped diff is
#   # never re-examined, by either source. Measured in infra-commons/meta: 42 of 200 runs
#   # cancelled (21%) — 42 merged diffs never reviewed by anything.
#   #
#   # The trade is deliberate. Without a group, two overlapping runs can double-file one
#   # finding (the title/location dedup closes most of it, but not a same-instant race).
#   # A duplicate issue is visible and recoverable; a missed diff is neither.
#
#   jobs:
#     capture:
#       # Pin at or after #148 — see "PR-time ingest needs a pin at/after #148" below.
#       uses: infra-commons/security/.github/workflows/capture-findings-reusable.yml@<SHA>
#       with:
#         severity_floor: HIGH   # optional; empty/omitted defaults to HIGH (historical)
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#         # Optional (infra-commons/meta#661) — omit entirely until this org has provisioned the
#         # secret; a newly-filed CRITICAL/HIGH just won't be board-added, nothing else changes:
#         INFRA_COMMONS_BOT_PRIVATE_KEY: ${{ secrets.INFRA_COMMONS_BOT_PRIVATE_KEY }}
#
# PR-time ingest needs a pin at or after #148 (b4d7507).
#
# Source 1 (the PR-time reviewers' comments) needs `pull-requests: read`, which is minted
# on the App token by the step below — and only from #148 onward. A caller pinned earlier
# still runs, still files everything its own post-merge pass finds, and still exits
# identically; it just ingests NOTHING from either PR-time reviewer. That is no longer
# silent: the run says so on stderr, in the job-summary notes with the remedy, and in the
# capture receipt's "PR read access" row.
#
# The caller workflow must grant:
#   permissions:
#     contents: read
#     issues: write

permissions: {}

on:
  workflow_call:
    inputs:
      severity_floor:
        description: >-
          Lowest severity (CRITICAL|HIGH|MEDIUM|LOW) that gets an individual
          GitHub Issue; findings below it roll into the rolling MEDIUM/LOW
          digest instead. Empty defaults to HIGH — CRITICAL+HIGH individual,
          MEDIUM+LOW digest — the historical, previously-hardcoded behaviour.
        type: string
        required: false
        default: ""
      ingest_pr_reviews:
        description: >-
          Set false to review only the merged diff, as this workflow did before
          infra-commons/meta#1187 — findings raised by a PR-time reviewer but not
          rediscovered by the post-merge pass then go unfiled again, which is the gap
          the ingest closes. Default true.
        type: boolean
        required: false
        default: true
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      INFRA_COMMONS_BOT_PRIVATE_KEY:
        description: >-
          Optional. The infra-commons-bot App's private key, forwarded by the caller so a newly
          filed CRITICAL or HIGH finding can be added to the org's board Inbox
          (infra-commons/meta#661). Not
          required — omitted or empty, board-add is skipped and everything else is unaffected.
        required: false

jobs:
  capture:
    name: Capture findings from merged diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      # infra-commons/security#90 — `secrets` is not a context a step `if:` may read (GitHub's
      # context-availability table has no `secrets` row for `jobs.<job_id>.steps[*].if`, and none
      # for `jobs.<job_id>.if` either — job-level `if:` isn't a legal shortcut here). `jobs.<job_id>.env`
      # IS one of the places `secrets` may be read, and a step's `if:` CAN read `env`, so the
      # secret's presence has to be mapped here and tested as a plain env var below. A step
      # cannot read its own `env:` block from its own `if:` — this has to sit at job level so it
      # exists before the first step's `if:` is evaluated.
      BOARD_APP_KEY: ${{ secrets.INFRA_COMMONS_BOT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Board-add token (infra-commons/meta#661) — mints an App installation token carrying
      # `organization_projects: write`, the one permission `github.token` above can never hold no
      # matter what this job's `permissions:` block says (org-level Projects v2 is outside the
      # default Actions token's grantable scopes entirely). Both guards below keep this strictly
      # additive to the job that already runs today:
      #   - `if:` — the caller's org hasn't provisioned the secret yet ⇒ step is skipped outright,
      #     `steps.board-token.outputs.token` reads empty, capture.py sees no BOARD_APP_TOKEN and
      #     just doesn't attempt a board-add. This is every caller's state right now.
      #   - `continue-on-error: true` — secret present but minting fails for any reason (App not
      #     installed in this org, wrong owner, revoked key) ⇒ the step reports failed but the JOB
      #     does not, so the findings capture below still runs to completion.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: board-token
        if: ${{ env.BOARD_APP_KEY != '' }}
        continue-on-error: true
        with:
          # infra-commons-bot's client ID — a public identifier, not a credential; the private key
          # below is the secret. Same App, same constant used in infra-commons/meta's
          # expand-inbox.yml. Gitleaks' entropy rule can't tell a public App id from a secret, so
          # this line is allowed explicitly rather than widening the rule for the whole repo.
          client-id: Iv23liH9thgSIViTxbMV # gitleaks:allow
          private-key: ${{ secrets.INFRA_COMMONS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # `create-github-app-token` replaces the App install's full grant with exactly the
          # `permission-*` inputs given here rather than narrowing it additively — so without this,
          # the minted token holds `organization_projects` and nothing else. `addProjectV2ItemById`
          # below needs to resolve its `contentId` (the issue this same job just created) as an
          # Issue node, which requires read access to it; omitting this silently no-ops the board-add
          # as an indistinguishable `NOT_FOUND` (infra-commons/meta#661).
          permission-organization-projects: write
          permission-issues: read
          # Reading the PR-time reviewers' comments (infra-commons/meta#1187). This job's
          # `github.token` can never carry this: a called workflow's token is capped by the
          # CALLER's `permissions:` block, and callers grant `contents: read` + `issues: write`
          # only. Requesting `pull-requests: read` in this job's own `permissions:` block below
          # would not widen it either — it would hard-fail every caller that hasn't first edited
          # its own workflow, which is the security#90 fleet-outage shape. The App installation
          # already holds `pull_requests` in every org, so minting it here needs no caller change
          # at all — only the pin bump any change to this file needs.
          #
          # capture.py tries `github.token` FIRST and falls back to this. A caller still on an
          # older pin does NOT degrade to commit-subject PR resolution — it stops: that fallback
          # verifies each candidate against `/issues/{N}`, which for a pull-request number needs
          # the same access as the `/commits/{sha}/pulls` lookup whose refusal invoked it, so the
          # same missing key shuts both doors (measured, infra-commons/meta run 33673760827,
          # 2026-09-02). Such a run now reports the refusal and this remedy instead of an
          # innocuous "no merged pull request resolved". The winning
          # credential is named in the "PR resolution" row of the job summary's capture receipt —
          # which credential can read pull requests here is a per-caller fact that only a live 200
          # answers. That was described here before it was implemented: _get_json() returned on the
          # first 200 without the label, so no run ever reported it.
          permission-pull-requests: read

      # Pinned to the capture-findings/v1 moving tag, not a raw SHA: a capture.py fix
      # ships by moving this tag (see README) — no reusable/consumer edit needed, which
      # is what the 2026-07-02 stale-inner-pin incident (#20/#21) cost us.
      - uses: infra-commons/security/.github/actions/capture-findings@capture-findings/v1
        with:
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          repo: ${{ github.repository }}
          before-sha: ${{ github.event.before }}
          after-sha: ${{ github.event.after }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          severity-floor: ${{ inputs.severity_floor }}
          board-app-token: ${{ steps.board-token.outputs.token }}
          ingest-pr-reviews: ${{ inputs.ingest_pr_reviews }}
