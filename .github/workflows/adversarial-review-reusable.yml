name: Adversarial review (reusable)

# Reusable adversarial AI security review, shared by every Rolliq repo.
#
# Caller pattern (the caller must trigger on `pull_request`):
#   jobs:
#     adversarial-review:
#       uses: infra-commons/security/.github/workflows/adversarial-review-reusable.yml@<SHA> # pin to immutable SHA
#       secrets: inherit          # passes ANTHROPIC_API_KEY (and OPENAI_API_KEY)
#       with:
#         run-openai: true        # optional — second reviewer, default false
#
# The caller workflow must grant `contents: read`, `pull-requests: write` and
# `issues: write`.
# Resulting checks: `<caller-job-id> / claude`, `/ openai` (if enabled), `/ gate`.
# Make `<caller-job-id> / gate` the required status check.
#
# ── What a caller's SHA pin on THIS file covers ───────────────────────────────
# The `claude`/`openai`/`gate` jobs below call two composite actions —
# `adversarial-review` and `adversarial-review-gate` — pinned below to commit
# SHAs, the same way callers pin THIS file. A caller's SHA pin on this reusable
# now genuinely covers the code that reviews the diff and the code that decides
# whether it merges, not only the orchestration around them.
#
# This was NOT always true. Until infra-commons/security#95, both composites
# were resolved from moving `<family>/v1` tags instead, so a caller's SHA pin
# fixed only which version of THIS file ran — the two composites re-resolved
# from whatever the moving tag pointed to at run time, identically for every
# caller and every pin, including one from years ago. That shape was deliberate,
# not an oversight (fleet-wide review/gate fixes shipping on one tag move, with
# no per-caller PR — see ADR 0008 in rolliq-com), and the moving tags' integrity
# rested on this repo's `protect-moving-tags` ruleset, which has flip-flopped
# between deletion-only and a hardened update-restricted state more than once —
# see infra-commons/security#52 for that history. #95's fix (this pin) is a
# deliberate reversal of that tradeoff for this lineage specifically, made on
# explicit operator sign-off; see reviews/2026-08-17-composite-pin-posture-decision.md
# in this repo for the tradeoff being reversed.
#
# Bump these THREE SHAs deliberately, the same way callers bump their pin on
# this file: cut (or confirm) the composite's own `<family>/vX.Y.Z` immutable
# release tag, point the `uses:` line at that commit's SHA, and land it as an
# ordinary reviewed PR to this repo. Three, not two: `adversarial-review` is
# pinned twice (the Claude reviewer and the OpenAI reviewer are separate jobs)
# and `adversarial-review-gate` once. Count the composite `uses:` lines below
# and expect exactly three — a bump that moves only the two reviewer pins is a
# half bump, and this line said "two" through several of them.
#
# There is no more zero-PR fleet-wide propagation for
# `adversarial-review`/`adversarial-review-gate` fixes — every fix now needs
# this file bumped, same as every other change here, and every caller pinning
# this file by SHA needs its own follow-up bump to actually receive it.
# `release-composites.yml` still cuts `<family>/vX.Y.Z` immutable release tags
# for `adversarial-review` (its moving tag is still tracked as a side effect of
# this file being part of that family's surface, per #63) — that immutable tag
# is the natural source for the SHA to bump to, even though nothing here
# resolves the moving tag itself anymore.
#
# ── What enabling the second reviewer does, and does not, buy ────────────────
# The gate result is three-state, not boolean (see the gate action's script):
#
#   blocked    a reviewer found a CRITICAL, a reviewer that was asked to run was
#              skipped (a configuration fault), or NO reviewer completed
#   degraded   at least one reviewer answered and at least one did not — the
#              check PASSES and a tracking issue records the reduced coverage
#   clear      every reviewer that was asked to run answered
#
# So a second provider genuinely is a fallback: one vendor's outage degrades the
# gate instead of freezing every merge in the repo. Combining the reviewers with
# a boolean AND would do the opposite — it would double the number of vendors
# able to freeze the repo, while reading like redundancy.
#
# A CRITICAL from *either* reviewer still blocks. That is not loosened here.
#
# ── The one case where a repeat tightens: an exhausted provider budget ───────
# Failing open on a rate limit and failing open on an exhausted spend budget are
# not the same trade. A rate limit is transient — the next run reviews the
# change. A budget is not: left on the transient path, every subsequent PR would
# merge unreviewed and green for as long as the billing period lasts.
#
# So a `quota-exhausted` outcome degrades on the FIRST PR (which still passes,
# so billing lapsing does not hold up the change in front of it) and BLOCKS
# afterwards. The memory that tells first from subsequent is a tracking issue in
# the calling repo, opened by this workflow and read back on the next run.
# Closing that issue — after topping up the account — re-arms the single pass.
#
# The block requires that NO reviewer produced a verdict. If a second provider
# reviewed the change, the change was reviewed and this does not fire.
#
# The old RELEASE ORDER hazard this section used to document — the gate tag
# having to exist before a caller could safely pin a SHA at or after a given
# commit — no longer applies: both composites are baked-in SHAs now, so there
# is nothing left to resolve at run time and no ordering to get wrong.

# Default all permissions to none — each job declares exactly what it needs.
# This prevents future jobs added without explicit permissions from inheriting
# the caller's full token scope via secrets: inherit.
permissions: {}

on:
  workflow_call:
    inputs:
      run-openai:
        description: "Also run the OpenAI reviewer (needs OPENAI_API_KEY)."
        type: boolean
        required: false
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: false   # not available in Dependabot/fork contexts; claude job skips itself
      OPENAI_API_KEY:
        required: false

jobs:
  # ── Claude reviewer ────────────────────────────────────────────────────────
  claude:
    name: claude
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip forks and Dependabot PRs — no secret access. The gate treats those
    # skips as acceptable; a skip on a normal PR blocks merge.
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_critical: ${{ steps.review.outputs.has_critical }}
      outcome: ${{ steps.review.outputs.outcome }}
    steps:
      - id: review
        uses: infra-commons/security/.github/actions/adversarial-review@d758e6aa29b8953ec6aabc89f5a08e3442982118 # adversarial-review/v1.15.0
        with:
          provider: anthropic
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  # ── OpenAI reviewer (optional second perspective) ──────────────────────────
  openai:
    name: openai
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{ inputs.run-openai
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_critical: ${{ steps.review.outputs.has_critical }}
      outcome: ${{ steps.review.outputs.outcome }}
    steps:
      - id: review
        uses: infra-commons/security/.github/actions/adversarial-review@d758e6aa29b8953ec6aabc89f5a08e3442982118 # adversarial-review/v1.15.0
        with:
          provider: openai
          api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  # ── Blocking gate ──────────────────────────────────────────────────────────
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [claude, openai]
    if: always()
    permissions:
      issues: write
    steps:
      # The durable memory behind "fail open once, then block". A job has no
      # state of its own, so the record that a previous PR already passed
      # unreviewed on an exhausted budget lives in an issue — visible to a
      # human, and closable by one, which is what re-arms the free pass.
      #
      # This step only READS. It must not fail the job: an inability to look up
      # the marker is not a reason to block a merge, and `|| true` plus the
      # empty default means an error here degrades to today's fail-open
      # behaviour rather than to a repo-wide freeze. That is a DELIBERATE,
      # unchanged choice, not an oversight: fail-closed on an unreadable marker
      # would block every PR fleet-wide on a transient `gh` API blip, which is
      # worse than the exposure it would close. It does leave a narrower version
      # of the same fail-open this step's label requirement (below) closes on
      # the write side — anyone who can make THIS search error out (not just
      # anyone who can open an issue) gets the same "reads as not open" result a
      # title squat used to give them for free. That residual is accepted
      # because causing a `gh search` call to fail is far harder than opening an
      # issue with a chosen title, and because it is now bounded by the write
      # side requiring the label — a squatted title alone no longer suppresses
      # the real marker's creation, only a genuine read failure does.
      #
      # infra-commons/security#81: matches "Record that the provider quota is
      # exhausted" below on identification, requiring the SAME label this job's
      # own token applies, not just the title. See that step's comment for the
      # full exploit this closes; this half of the fix is what makes the fix
      # visible on the read side — a write-side label with no matching read-side
      # requirement would still let a title-only squat force a false
      # "open=false" on the very next PR by simply not matching the labelled
      # issue the write step actually created.
      - name: Look up the quota tracking issue
        id: quota_marker
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          LABEL="security:quota-exhausted"
          TITLE="[security] Adversarial review: provider quota exhausted"
          COUNT=$(gh issue list --repo "$REPO" \
                    --search "\"${TITLE}\" in:title label:\"${LABEL}\"" \
                    --state open --json number --jq 'length' 2>/dev/null || echo "")
          if [ "${COUNT:-0}" -gt 0 ] 2>/dev/null; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

      # The decision is a Python script inside a composite action, not inline
      # bash, because it is the only thing standing between a review and a
      # merge and its degraded paths have to be reachable by a unit test. As
      # inline shell they were reachable only in production, which is where
      # this gate's worst failure mode kept being discovered.
      #
      # The SHA below is the adversarial-review/v1.15.0 release commit, shared with
      # the two reviewer steps above so one release is one SHA in this file. It is
      # deliberately NOT tagged in this action's own family: no
      # `adversarial-review-gate/vX.Y.Z` tag exists past v1.3.0, and the moving
      # `adversarial-review-gate/v1` still points at 01fff5eb, which predates the
      # gate fix in #135. That did NOT change when v1.15.0 was released on
      # 2026-09-04: the release cut `adversarial-review/v1.15.0` and
      # `capture-findings/v1.15.0` and left `adversarial-review-gate/v1` where it
      # was, because the gate family is not in the release set at all — its only
      # `uses:` is this SHA pin, which `discover_pins()` ignores by design, and
      # there is no `adversarial-review-gate-reusable.yml` to discover it by name.
      # The comment therefore names the release, not a gate-family tag — earlier
      # revisions of this line claimed `adversarial-review-gate/v1.9.0` and
      # `v1.11.0`, neither of which has ever existed.
      #
      # This bump is a no-op for the gate's RUNTIME: `action.yml` and `gate.py` are
      # byte-identical between 227529b2 and d758e6aa, and unchanged since #135
      # (1241d6a8). Only `test_gate_wiring.py` differs across that span (#151), so
      # nothing the gate executes moves here — but the directory is not unchanged,
      # which the previous wording implied.
      - name: Evaluate findings
        id: evaluate
        uses: infra-commons/security/.github/actions/adversarial-review-gate@d758e6aa29b8953ec6aabc89f5a08e3442982118 # = adversarial-review/v1.15.0
        with:
          claude-result: ${{ needs.claude.result }}
          claude-has-critical: ${{ needs.claude.outputs.has_critical }}
          claude-outcome: ${{ needs.claude.outputs.outcome }}
          openai-result: ${{ needs.openai.result }}
          openai-has-critical: ${{ needs.openai.outputs.has_critical }}
          openai-outcome: ${{ needs.openai.outputs.outcome }}
          run-openai: ${{ inputs.run-openai }}
          is-fork: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          is-dependabot: ${{ github.actor == 'dependabot[bot]' }}
          quota-marker-open: ${{ steps.quota_marker.outputs.open }}

      # Opened on the FIRST quota-exhausted PR, which is the one the gate lets
      # through. Its existence is what blocks the second, so this must run even
      # when the gate step failed — `always()` is load-bearing here, not
      # decoration.
      #
      # infra-commons/security#81, matching #80's fix on the degraded-pass and
      # critical-findings issues: deduplicated on a LABEL this step applies
      # itself, not on title text alone. A title is plain text — opening an
      # issue needs no special privilege — so before this fix, an attacker with
      # only issue-create access could pre-file this exact title, any time. The
      # real exhaustion's dedupe (title-only) would then find the squatted
      # issue and skip creating the real marker; the attacker closes theirs;
      # the *next* PR's "Look up the quota tracking issue" step (also fixed by
      # #81) reads nothing open and fails open again — silently defeating "fail
      # open once, then block," which is the entire point of this mechanism
      # (see this file's header comment on why a budget, unlike a rate limit,
      # must not be left on the fail-open path indefinitely).
      #
      # Unlike #80's degraded-pass step, there is no external, title-only
      # reader of THIS issue to stay backward-compatible with — the only reader
      # is the lookup step above, in this same job, which this fix also gates
      # on the label. So there is deliberately NO fallback that creates an
      # unlabelled issue if the labelled create fails (contrast the sibling
      # steps below, which do have one for a real compatibility reason). An
      # unlabelled fallback here would satisfy nothing: the next run's
      # label-gated lookup could never find it, silently reverting the whole
      # mechanism to indefinite fail-open — the exact failure this fix closes.
      # Letting `gh issue create` fail the step (and therefore this required
      # check) on that path is the correct, safe-direction behaviour instead:
      # worst case one PR is blocked by a `gh` API failure, not every
      # subsequent PR merged unreviewed for the rest of the billing period.
      - name: Record that the provider quota is exhausted
        if: ${{ always() && steps.evaluate.outputs.quota_exhausted == 'true' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          UNAVAILABLE: ${{ steps.evaluate.outputs.unavailable }}
        run: |
          LABEL="security:quota-exhausted"
          TITLE="[security] Adversarial review: provider quota exhausted"

          # Best-effort and idempotent (--force updates rather than errors on a
          # label that already exists), and deliberately NOT fatal: on a repo
          # that already has this label (e.g. from a prior run) a failure here
          # changes nothing, so failing a required check for it would block a PR
          # this step was only meant to annotate. Where the label genuinely is
          # absent, the labelled issue-create below hard-fails with a specific
          # ::error:: naming it. What this call does owe is a STATEMENT that it
          # failed: that ::error:: tells the reader to check whether this
          # succeeded, and the `>/dev/null 2>&1 || true` this replaces made that
          # instruction impossible to follow. Stderr is folded onto one line
          # because a captured line beginning `::` would be re-parsed by the
          # runner as its own workflow command.
          #
          # `--repo "$REPO"` is load-bearing, not decoration: this job has no
          # `actions/checkout`, so `gh` has no git remote to infer a target from
          # and (with no GH_REPO in this step's env) dies with "not a git
          # repository". The label is then never created and the labelled
          # issue-create below fails with `could not add label: '<label>' not
          # found` — a message that reads like a provisioning or permissions
          # problem in the caller repo and is neither. That was
          # infra-commons/meta#1092/#1094 (2026-08-27), where the quota marker
          # was never filed at all, so the next run's lookup found nothing open
          # and the escalation never converged. Asserted by
          # test_every_gh_call_in_the_gate_job_names_the_repo_explicitly.
          #
          # CORRECTION (infra-commons/security#149): the missing flag was ONE of
          # two independent causes, and #135 fixed only it. The `--description`
          # below ran to 172 characters against GitHub's 100-character cap, so
          # this call returned a 422 and created nothing regardless of `--repo`
          # — and had done since #80/#99 added the descriptions, so it had never
          # once succeeded on any repo. Both causes reach the same end state,
          # which is why the first attribution read as complete; this was
          # unreachable code HERE, not a provisioning gap in the caller org.
          # Now asserted by
          # test_each_provisioned_label_description_is_within_githubs_limit.
          if ! LABEL_ERR=$(gh label create "$LABEL" --repo "$REPO" --color D93F0B \
            --description "Applied only by the adversarial-review gate's own token; its dedupe and lookup depend on that." \
            --force 2>&1); then
            echo "::warning::Could not provision the ${LABEL} label on ${REPO}: ${LABEL_ERR//$'\n'/ }"
          fi

          EXISTING=$(gh issue list --repo "$REPO" \
            --search "\"${TITLE}\" in:title label:\"${LABEL}\"" \
            --state open --json number --jq 'length')
          if [ "${EXISTING}" -gt "0" ]; then
            echo "Quota tracking issue already open — leaving it as the block signal."
            exit 0
          fi
          BODY=$(printf '%s\n\n%s\n\n%s\n\n%s\n\n---\n%s' \
            "## The adversarial reviewer's provider budget is exhausted" \
            "[PR #${PR_NUMBER}](${PR_URL}) passed **without being reviewed**, because these reviewers reported an exhausted quota: **${UNAVAILABLE}**." \
            "Unlike a rate limit, this does not clear by itself. **While this issue is open, further PRs will be BLOCKED** rather than merged unreviewed — that is deliberate: the first change is not held up, the tenth is not shipped unreviewed." \
            "**To restore review:** top up the provider account or raise its spend cap, confirm a review runs, then close this issue. Closing it re-arms the one-time pass." \
            "_Created automatically by the \`adversarial-review / gate\` workflow._")
          # NOTE: deliberately no unlabeled-fallback create here — see this
          # step's header comment above. The annotation exists so that when this
          # step does fail, the job says which failure it was (the label could
          # not be applied vs. the issue could not be created) and that blocking
          # is the designed response, rather than leaving a bare `gh` error on a
          # required check for someone to guess at.
          gh issue create --repo "$REPO" --title "${TITLE}" --body "$BODY" --label "$LABEL" || {
            echo "::error::Could not file the quota-exhausted tracking issue with the ${LABEL} label on ${REPO}. This step has NO unlabeled fallback by design: an unlabeled issue is invisible to the label-gated lookup on the next run, which would silently revert this gate to fail-open for the rest of the billing period (infra-commons/security#81). Blocking this PR is the safe direction. Check that this job's token has issues:write on ${REPO} and that the label create above succeeded."
            exit 1
          }

      # A degraded pass renders in the checks UI exactly like a full pass, so
      # without a durable record nobody learns that a merge happened on fewer
      # reviews than the repo is configured for. One issue per PR.
      #
      # Deduplicated on a LABEL this step applies itself, not on title text alone.
      # A title is plain text: opening an issue needs no special privilege, so
      # anyone could pre-file "[security] Adversarial review passed degraded on
      # PR #<N>" for a PR number they only have to guess, BEFORE this step runs.
      # A title-only existence check would find that squatted issue, skip
      # creating the real one, and — once the squatter closes theirs — leave
      # infra-commons/meta#566's consumer (sharedinfra/scripts/merge-ready.py,
      # which reads open issues back to decide whether a PR merges unread) with
      # a clean, COMPLETE, empty result for a PR that was genuinely degraded.
      # `issues: write` on this job's token is what an outside issue-opener does
      # not have, so requiring the label closes exactly that gap.
      #
      # The FORGE direction is deliberately left open by this: anyone can still
      # open an issue with the right title (and no label) for a PR that was
      # NEVER degraded, and merge-ready.py's title-only regex would still read
      # it as one, forcing a spurious T2 hold. That is the fail-safe direction —
      # worst case an operator reads a clean PR by hand — and closing it means
      # merge-ready.py itself checking for this label too, which is a separate,
      # already-tracked, consumer-side change and not done here.
      #
      # TITLE is unchanged from before this label was added — that is what keeps
      # this backward-compatible with #566's consumer without any coordinated
      # landing order: the old signal never stops being emitted, so there is no
      # window where a reader that only understands the old signal goes blind.
      #
      # This still dedupes via `gh issue list --search`, i.e. GitHub's search
      # INDEX, same as before — not the primary-API read merge-ready.py
      # deliberately uses instead to avoid index lag (see its own comments on
      # `fetch_degraded_pass_prs`). That staleness surface is pre-existing here,
      # not introduced by the label, and is unchanged by this fix: worst case on
      # a lagging index is a duplicate issue for the same PR, not a suppressed
      # one, so it is left as-is rather than folded into this change.
      #
      # The label name carries a colon (`security:degraded-pass`), matching this
      # fleet's namespaced-label convention. Verified directly against the
      # search API (infra-commons/security#78, created and torn down for this
      # check) that `label:"ns:value"` — quoted, colon included — parses and
      # filters correctly rather than silently matching nothing.
      - name: Record a degraded pass
        if: ${{ always() && steps.evaluate.outputs.degraded == 'true' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          UNAVAILABLE: ${{ steps.evaluate.outputs.unavailable }}
        run: |
          LABEL="security:degraded-pass"
          TITLE="[security] Adversarial review passed degraded on PR #${PR_NUMBER}"

          # Best-effort and idempotent (--force updates rather than errors on a
          # label that already exists). Its failure must never block the durable
          # record below — see the fallback `gh issue create` at the bottom —
          # but it must not be SILENT either. This description used to run to
          # 142 characters against GitHub's 100-character cap, so the call
          # returned a 422 and created nothing on every repo and every run,
          # while `>/dev/null 2>&1 || true` discarded the one string that said
          # so; the label-gated dedupe below was then inert and this step filed
          # a fresh unlabelled issue per RUN rather than per PR
          # (infra-commons/security#149 — see the quota recorder above for the
          # full correction). Stderr is folded onto one line because a captured
          # line beginning `::` would be re-parsed as its own workflow command.
          if ! LABEL_ERR=$(gh label create "$LABEL" --repo "$REPO" --color 5319E7 \
            --description "Applied only by the adversarial-review gate's own token; its dedupe depends on that." \
            --force 2>&1); then
            echo "::warning::Could not provision the ${LABEL} label on ${REPO}: ${LABEL_ERR//$'\n'/ }"
          fi

          EXISTING=$(gh issue list --repo "$REPO" \
            --search "\"${TITLE}\" in:title label:\"${LABEL}\"" \
            --state open --json number --jq 'length')
          if [ "${EXISTING}" -gt "0" ]; then
            echo "Degraded-pass issue already open for PR #${PR_NUMBER} — skipping."
            exit 0
          fi
          BODY=$(printf '%s\n\n%s\n\n%s\n\n---\n%s' \
            "## Adversarial review passed with fewer reviewers than configured" \
            "[PR #${PR_NUMBER}](${PR_URL}) passed the adversarial review gate, but these reviewers produced no verdict: **${UNAVAILABLE}**." \
            "The gate passes in this state deliberately: a reviewer that did not complete produced no finding to weigh, and blocking every merge on a provider outage costs more than it buys. It is recorded here so the reduced coverage is visible rather than silent. Re-run the workflow once the provider is available if the change warrants a full review." \
            "_Created automatically by the \`adversarial-review / gate\` workflow._")
          gh issue create --repo "$REPO" --title "${TITLE}" --body "$BODY" --label "$LABEL" \
            || gh issue create --repo "$REPO" --title "${TITLE}" --body "$BODY"

      # Same title-squat exposure as "Record a degraded pass" above, and the
      # same label-based fix — see that step's comment for the full mechanism.
      # Lower stakes here specifically because a real CRITICAL still fails the
      # `claude`/`openai` check independently of this issue existing, so a
      # suppressed issue loses the tracking record, not the block itself.
      - name: Create tracking issue for critical findings
        if: >-
          ${{ always()
              && (needs.claude.outputs.has_critical == 'true' || needs.openai.outputs.has_critical == 'true')
              && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          LABEL="security:critical-findings"
          TITLE="[security] Critical findings on PR #${PR_NUMBER}"

          # Best-effort, idempotent and non-fatal for the same reasons as the two
          # steps above, and — since infra-commons/security#149 — under the same
          # 100-character description cap and no longer silent when it fails.
          if ! LABEL_ERR=$(gh label create "$LABEL" --repo "$REPO" --color B60205 \
            --description "Applied only by the adversarial-review gate's own token; its dedupe depends on that." \
            --force 2>&1); then
            echo "::warning::Could not provision the ${LABEL} label on ${REPO}: ${LABEL_ERR//$'\n'/ }"
          fi

          EXISTING=$(gh issue list --repo "$REPO" \
            --search "\"${TITLE}\" in:title label:\"${LABEL}\"" \
            --state open --json number --jq 'length')
          if [ "${EXISTING}" -gt "0" ]; then
            echo "Tracking issue already open for PR #${PR_NUMBER} — skipping."
            exit 0
          fi
          BODY=$(printf '%s\n\n%s\n\n%s\n\n---\n%s' \
            "## Critical security findings — action required" \
            "The adversarial AI security review identified **critical findings** on [PR #${PR_NUMBER}](${PR_URL}) that must be resolved before the PR can be merged." \
            "**View findings:** See the adversarial review comment on [PR #${PR_NUMBER}](${PR_URL})." \
            "_Created automatically by the \`adversarial-review / gate\` workflow. Close when the PR is updated and the gate passes._")
          gh issue create --repo "$REPO" --title "${TITLE}" --body "$BODY" --label "$LABEL" \
            || gh issue create --repo "$REPO" --title "${TITLE}" --body "$BODY"
