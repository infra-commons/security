name: Adversarial review (reusable)

# Reusable adversarial AI security review, shared by every Rolliq repo.
#
# Caller pattern (the caller must trigger on `pull_request`):
#   jobs:
#     adversarial-review:
#       uses: infra-commons/security/.github/workflows/adversarial-review-reusable.yml@<SHA> # pin to immutable SHA
#       secrets: inherit          # passes ANTHROPIC_API_KEY (and OPENAI_API_KEY)
#       with:
#         run-openai: true        # optional — second reviewer, default false
#
# The caller workflow must grant `contents: read`, `pull-requests: write` and
# `issues: write`.
# Resulting checks: `<caller-job-id> / claude`, `/ openai` (if enabled), `/ gate`.
# Make `<caller-job-id> / gate` the required status check.
#
# ── What enabling the second reviewer does, and does not, buy ────────────────
# The gate result is three-state, not boolean (see the gate action's script):
#
#   blocked    a reviewer found a CRITICAL, a reviewer that was asked to run was
#              skipped (a configuration fault), or NO reviewer completed
#   degraded   at least one reviewer answered and at least one did not — the
#              check PASSES and a tracking issue records the reduced coverage
#   clear      every reviewer that was asked to run answered
#
# So a second provider genuinely is a fallback: one vendor's outage degrades the
# gate instead of freezing every merge in the repo. Combining the reviewers with
# a boolean AND would do the opposite — it would double the number of vendors
# able to freeze the repo, while reading like redundancy.
#
# A CRITICAL from *either* reviewer still blocks. That is not loosened here.

# Default all permissions to none — each job declares exactly what it needs.
# This prevents future jobs added without explicit permissions from inheriting
# the caller's full token scope via secrets: inherit.
permissions: {}

on:
  workflow_call:
    inputs:
      run-openai:
        description: "Also run the OpenAI reviewer (needs OPENAI_API_KEY)."
        type: boolean
        required: false
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: false   # not available in Dependabot/fork contexts; claude job skips itself
      OPENAI_API_KEY:
        required: false

jobs:
  # ── Claude reviewer ────────────────────────────────────────────────────────
  claude:
    name: claude
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip forks and Dependabot PRs — no secret access. The gate treats those
    # skips as acceptable; a skip on a normal PR blocks merge.
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_critical: ${{ steps.review.outputs.has_critical }}
      outcome: ${{ steps.review.outputs.outcome }}
    steps:
      - id: review
        uses: infra-commons/security/.github/actions/adversarial-review@adversarial-review/v1
        with:
          provider: anthropic
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  # ── OpenAI reviewer (optional second perspective) ──────────────────────────
  openai:
    name: openai
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{ inputs.run-openai
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_critical: ${{ steps.review.outputs.has_critical }}
      outcome: ${{ steps.review.outputs.outcome }}
    steps:
      - id: review
        uses: infra-commons/security/.github/actions/adversarial-review@adversarial-review/v1
        with:
          provider: openai
          api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

  # ── Blocking gate ──────────────────────────────────────────────────────────
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [claude, openai]
    if: always()
    permissions:
      issues: write
    steps:
      # The decision is a Python script inside a composite action, not inline
      # bash, because it is the only thing standing between a review and a
      # merge and its degraded paths need to be reachable by a unit test. This
      # gate's worst failure mode had been observed three times in production
      # and never once in a test, precisely because it was unreachable shell.
      - name: Evaluate findings
        id: evaluate
        uses: infra-commons/security/.github/actions/adversarial-review-gate@adversarial-review-gate/v1
        with:
          claude-result: ${{ needs.claude.result }}
          claude-has-critical: ${{ needs.claude.outputs.has_critical }}
          claude-outcome: ${{ needs.claude.outputs.outcome }}
          openai-result: ${{ needs.openai.result }}
          openai-has-critical: ${{ needs.openai.outputs.has_critical }}
          openai-outcome: ${{ needs.openai.outputs.outcome }}
          run-openai: ${{ inputs.run-openai }}
          is-fork: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          is-dependabot: ${{ github.actor == 'dependabot[bot]' }}

      # A degraded pass renders in the checks UI exactly like a full pass, so
      # without a durable record nobody learns that a merge happened on fewer
      # reviews than the repo is configured for. One issue per PR, deduplicated
      # by title the same way the critical-findings issue is.
      - name: Record a degraded pass
        if: ${{ always() && steps.evaluate.outputs.degraded == 'true' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          UNAVAILABLE: ${{ steps.evaluate.outputs.unavailable }}
        run: |
          TITLE="[security] Adversarial review passed degraded on PR #${PR_NUMBER}"
          EXISTING=$(gh issue list --repo "$REPO" --search "${TITLE}" --state open --json number --jq 'length')
          if [ "${EXISTING}" -gt "0" ]; then
            echo "Degraded-pass issue already open for PR #${PR_NUMBER} — skipping."
            exit 0
          fi
          BODY=$(printf '%s\n\n%s\n\n%s\n\n---\n%s' \
            "## Adversarial review passed with fewer reviewers than configured" \
            "[PR #${PR_NUMBER}](${PR_URL}) passed the adversarial review gate, but these reviewers produced no verdict: **${UNAVAILABLE}**." \
            "The gate passes in this state deliberately: a reviewer that did not complete produced no finding to weigh, and blocking every merge on a provider outage costs more than it buys. It is recorded here so the reduced coverage is visible rather than silent. Re-run the workflow once the provider is available if the change warrants a full review." \
            "_Created automatically by the \`adversarial-review / gate\` workflow._")
          gh issue create \
            --repo "$REPO" \
            --title "${TITLE}" \
            --body "$BODY"

      - name: Create tracking issue for critical findings
        if: >-
          ${{ always()
              && (needs.claude.outputs.has_critical == 'true' || needs.openai.outputs.has_critical == 'true')
              && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="[security] Critical findings on PR #${PR_NUMBER}"
          EXISTING=$(gh issue list --repo "$REPO" --search "${TITLE}" --state open --json number --jq 'length')
          if [ "${EXISTING}" -gt "0" ]; then
            echo "Tracking issue already open for PR #${PR_NUMBER} — skipping."
            exit 0
          fi
          BODY=$(printf '%s\n\n%s\n\n%s\n\n---\n%s' \
            "## Critical security findings — action required" \
            "The adversarial AI security review identified **critical findings** on [PR #${PR_NUMBER}](${PR_URL}) that must be resolved before the PR can be merged." \
            "**View findings:** See the adversarial review comment on [PR #${PR_NUMBER}](${PR_URL})." \
            "_Created automatically by the \`adversarial-review / gate\` workflow. Close when the PR is updated and the gate passes._")
          gh issue create \
            --repo "$REPO" \
            --title "${TITLE}" \
            --body "$BODY"
