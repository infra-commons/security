name: Security — Tier A (reusable)

# Tier A security gate for production repos, client-facing systems, and
# any repo with Azure credentials or customer data in play.
#
# Runs on every push/PR/schedule/dispatch: Gitleaks secret scan (blocking),
#                                           Semgrep SAST (blocking on findings in changed files)
# Runs on every PR:                        Adversarial AI review (blocking on CRITICAL)
# Runs on schedule/manual:                 Trivy CVE scan + optional full AI review
#
# The adversarial AI review is the heavyweight check — it blocks merge on
# CRITICAL findings. Make the `adversarial-review / gate` check required
# in branch protection settings.
#
# infra-commons/security#102: Semgrep used to be gated `if: github.event_name == 'pull_request'`.
# A job whose `if:` is false still gets a check run — conclusion `skipped` — under its `name:`,
# and a skipped check satisfies a required status-check context, so a caller subscribed to both
# `push:` and `pull_request:` could have the never-scanned push run win a race against the real PR
# scan on the same head SHA. Semgrep now runs unconditionally instead (see the job below for why
# `adversarial-review` could not get the same fix).
#
# Caller pattern:
#
#   on:
#     push:
#       branches: [main]   # your integration branch(es) — never leave this unfiltered; an
#                           # unfiltered `push: {}` still double-fires with `pull_request:` on any
#                           # branch that also has an open PR
#     pull_request:
#       types: [opened, synchronize, reopened]
#     schedule:
#       - cron: '0 2 * * 0'   # Sunday 02:00 UTC
#     workflow_dispatch:
#       inputs:
#         run_ai_review:
#           type: boolean
#           default: false
#
#   concurrency:
#     group: security-${{ github.event_name }}-${{ github.ref }}
#     cancel-in-progress: true
#
#   jobs:
#     security:
#       uses: infra-commons/security/.github/workflows/tier-a.yml@<SHA>
#       with:
#         semgrep_config: 'p/python'
#         run_openai: false
#       secrets: inherit   # passes ANTHROPIC_API_KEY (and OPENAI_API_KEY if run_openai: true)
#
# The caller workflow must grant:
#   permissions:
#     contents: read
#     pull-requests: write
#
# Tier A repos: platform-iac, solution-*, clients-config
# Note: existing solution repos call the individual reusable workflows directly
#       for finer-grained control. This entrypoint is for NEW Tier A repos.

permissions: {}

on:
  workflow_call:
    inputs:
      semgrep_config:
        description: "Semgrep rule config (space-separated p/<ruleset> identifiers)"
        type: string
        required: false
        default: 'p/python p/security-audit'
      run_openai:
        description: "Also run the OpenAI adversarial reviewer (needs OPENAI_API_KEY)"
        type: boolean
        required: false
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false

jobs:
  # ── Secret scan (every push + PR) ────────────────────────────────────────────
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --source=/repo --redact --verbose --exit-code=1

  # ── SAST (every trigger — see #102 above) ─────────────────────────────────────
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Semgrep scan
        run: |
          pip install semgrep==1.163.0
          # Array, not a joined string (shellcheck SC2086) — each --config/value
          # pair is its own element, so an empty CONFIG_FLAGS expands to zero
          # arguments and a populated one expands to exactly the same argv the
          # old unquoted `$CONFIG_FLAGS` produced, without relying on word-split.
          CONFIG_FLAGS=()
          for cfg in ${{ inputs.semgrep_config }}; do
            CONFIG_FLAGS+=(--config "$cfg")
          done
          semgrep scan "${CONFIG_FLAGS[@]}" --text --error

  # ── Adversarial AI review (PR only) ──────────────────────────────────────────
  # Calls the reusable from this security repo. Make `adversarial-review / gate`
  # a required check in branch protection.
  # SHA-pinned even though it's same-repo: callers pin tier-a.yml to a SHA, but
  # GitHub resolves chained `uses:` refs independently — @main would always pull
  # the latest regardless of which SHA tier-a.yml was called at. Update this SHA
  # alongside any breaking change to adversarial-review-reusable.yml.
  #
  # infra-commons/security#102: this job has the same "if: false still reports a satisfying
  # skipped check" shape as the semgrep job above, but it CANNOT get the same fix (dropping the
  # `if:` so it always does real work). Traced what actually happens on a non-PR event: the
  # reusable's `claude`/`openai` jobs gate on `github.event.pull_request.head.repo.full_name`,
  # which is empty outside a PR, so both skip; its `gate` job runs anyway (`if: always()`) and —
  # per that job's own doc, "a reviewer that was asked to run was skipped" — renders a hard
  # `blocked` failure, not a pass. Dropping this `if:` would flip the bug from false-pass-on-push
  # to permanent false-fail-on-push, which would break every caller using this file's own
  # recommended `push:` trigger the moment one exists. Unlike Semgrep, a PR-diff AI review has no
  # meaningful non-PR equivalent to fall back to; the real fix is preventing this check run from
  # being created at all on non-PR events, which needs the caller to invoke a PR-only reusable
  # from a separately-triggered job rather than gating a job inside this one — out of scope here.
  # There is no live caller of tier-a.yml today, so this gap is currently dormant; don't "fix" it
  # by analogy with the semgrep change above without re-deriving the above first.
  adversarial-review:
    if: github.event_name == 'pull_request'
    uses: infra-commons/security/.github/workflows/adversarial-review-reusable.yml@79a6885cc67dba7eb40d655de959e3a2eb9367f3
    with:
      run-openai: ${{ inputs.run_openai }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # ── Dependency CVE scan (schedule + manual only) ─────────────────────────────
  trivy:
    name: Dependency scan (Trivy)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Trivy — filesystem CVE scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          ignore-unfixed: true
