name: Security — Tier B (reusable)

# Tier B security gate for internal tools, automation scripts, and repos
# with secrets in play but no external users.
#
# Runs on every push/PR:                   Gitleaks secret scan (blocking),
#                                           Semgrep SAST (blocking on findings the push/PR introduces)
# Runs on schedule/manual:                 Semgrep SAST (report only — no diff target to block on),
#                                           Trivy dependency CVE scan (non-blocking, report only)
#
# infra-commons/security#103: Semgrep blocks on new findings only — via `--baseline-commit` against
# the PR's merge base (pull_request) or the ref's previous tip (push) — never on a repo's
# pre-existing backlog. A push whose previous commit doesn't exist (new branch, some force-pushes)
# has no baseline to diff against and falls back to report-only, same as schedule/workflow_dispatch,
# rather than blocking on the entire existing tree at once. See
# reviews/2026-08-15-tier-b-semgrep-blast-radius-103.md for why this shape was chosen: the 3 Tier B
# callers carrying pre-existing findings are all pinned away from this file already (ancient SHA /
# frozen fork), so they're unaffected either way; only the 2 already-clean live callers reach this
# code today.
#
# infra-commons/security#102: Semgrep used to be gated `if: github.event_name == 'pull_request'`.
# A job whose `if:` is false still gets a check run — conclusion `skipped` — under its `name:`,
# and a skipped check satisfies a required status-check context. A caller subscribed to both
# `push:` and `pull_request:` would race two check runs under the same required name on the same
# head SHA, and the push run (skipped, no scan) was the one most likely to land last and win,
# because skipping is faster than scanning. Semgrep now runs unconditionally instead — it scans
# the checked-out ref, not a PR diff, so there is no event it can't meaningfully run on.
#
# Caller pattern:
#
#   on:
#     push:
#       branches: [main]   # your integration branch(es) — never leave this unfiltered; an
#                           # unfiltered `push: {}` still double-fires with `pull_request:` on any
#                           # branch that also has an open PR (belt: the unconditional job above;
#                           # this is the braces)
#     pull_request:
#       types: [opened, synchronize, reopened]
#     schedule:
#       - cron: '0 2 * * 0'   # Sunday 02:00 UTC
#     workflow_dispatch: {}
#
#   concurrency:
#     group: security-${{ github.event_name }}-${{ github.ref }}
#     cancel-in-progress: true
#
#   jobs:
#     security:
#       uses: infra-commons/security/.github/workflows/tier-b.yml@<SHA>
#       with:
#         semgrep_config: 'p/python'   # adjust to match repo language
#       # no secrets needed
#
# The caller workflow must grant:
#   permissions:
#     contents: read
#
# Tier B repos: rolliq-marketing, cashbucket-marketing

permissions: {}

on:
  workflow_call:
    inputs:
      semgrep_config:
        description: >-
          Semgrep rule config. Accepts p/<ruleset> identifiers or local paths.
          Examples: 'p/python', 'p/javascript', 'p/typescript', 'p/security-audit'.
          Multiple configs: separate with a space — they are passed as successive
          --config flags.
        type: string
        required: false
        default: 'p/python p/security-audit'

jobs:
  # ── Secret scan (every push + PR) ────────────────────────────────────────────
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --source=/repo --redact --verbose --exit-code=1

  # ── SAST (every trigger — see #102 above) ─────────────────────────────────────
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # --baseline-commit below needs real git history to compute a merge
          # base / diff against — a shallow (depth-1) checkout only has HEAD.
          fetch-depth: 0

      - name: Semgrep scan
        run: |
          pip install semgrep==1.163.0
          # Build --config flags from space-separated input. Array, not a joined
          # string (shellcheck SC2086) — each --config/value pair is its own
          # element, so an empty CONFIG_FLAGS expands to zero arguments and a
          # populated one expands to exactly the same argv the old unquoted
          # `$CONFIG_FLAGS` produced, without relying on word-splitting.
          CONFIG_FLAGS=()
          for cfg in ${{ inputs.semgrep_config }}; do
            CONFIG_FLAGS+=(--config "$cfg")
          done

          # infra-commons/security#103: block only findings this push/PR
          # introduces, never a repo's pre-existing backlog — see the header
          # comment above for why. BASELINE is the commit to diff against;
          # left empty means "no diff target," which falls through to the
          # original report-only behavior below.
          BASELINE=""
          case "${{ github.event_name }}" in
            pull_request)
              # Semgrep computes the merge base of HEAD and the ref we pass
              # internally, so passing the base tip is correct "against the
              # merge base" usage, not a diff against a possibly-stale tip.
              BASELINE="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              # github.event.before is all-zeros when there's no prior commit
              # to diff against (new branch, first push, some force-pushes).
              # Leave BASELINE empty in that case rather than diffing against
              # a commit that doesn't exist.
              if [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
                BASELINE="${{ github.event.before }}"
              fi
              ;;
            # schedule / workflow_dispatch: not tied to a ref move, so there's
            # no diff target — these are periodic full-repo audits, same as
            # the Trivy job below. BASELINE stays empty.
          esac

          if [[ -n "$BASELINE" ]]; then
            semgrep scan "${CONFIG_FLAGS[@]}" --baseline-commit "$BASELINE" --text --error
          else
            # No diff target: report-only, same behavior as before #103.
            semgrep scan "${CONFIG_FLAGS[@]}" --text || true
          fi

  # ── Dependency CVE scan (schedule + manual only) ─────────────────────────────
  trivy:
    name: Dependency scan (Trivy)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Trivy — filesystem CVE scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          ignore-unfixed: true
