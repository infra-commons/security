name: Release composites

# Moves each composite action's `<family>/vN` tag to `main` once its tests pass,
# and then asserts the tags actually landed.
#
# Why this is automated rather than documented: the README's manual release step
# ("cut a new immutable release tag, then move `<family>/v1`") was forgotten for
# six of the seven families as of 2026-07-31, one of them for two weeks. An
# unreleased fix is indistinguishable from a released one from inside this repo
# (`main` is green, the tests pass, the PR reads as shipped) while every
# consumer keeps running the old code. Automating the step removes the thing
# that was being forgotten; the verify job is what proves it happened.
#
# The tests gate is not a formality. These tags reach 13+ repos' merge gates
# with no per-caller pin bump to review them first, so the test jobs are the
# only automated check between an edit here and the fleet.

# This workflow was left `disabled_manually` from 2026-09-04's freeze handling until
# 2026-09-08, so no push-triggered release ran in that window even though main moved
# twice more (1f9d9209, 19e03ebe) after the disable. Re-enabled 2026-09-08; this
# comment-only commit is a deliberate, harmless push to re-arm the push -> Tests ->
# release chain, since `workflow_dispatch` alone cannot satisfy the release job's
# `event == 'push'` condition below. Operator-approved (infra-commons/meta#1357).
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  schedule:
    # A heartbeat, because the release path above is a chain: Tests must run,
    # succeed, and fire `workflow_run`. If any link breaks (the Tests workflow
    # is renamed, disabled, or stops running on main) the release silently
    # stops happening and every symptom is the same silence this whole workflow
    # exists to end. This job notices within a day without depending on it.
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

# NOTE: the concurrency group is deliberately declared on the `release` job and
# NOT here. A workflow-level group covers `verify` too, and `verify` is the
# heartbeat — it takes no lock, moves nothing, and only reads tags, so
# serialising it against tag moves buys nothing and costs the heartbeat its
# life. With `cancel-in-progress: false` a queued run is not the leader, and
# only one run may be queued per group, so each nightly heartbeat became the
# queued run that the next arrival cancelled. An unapproved release therefore
# suppressed the one check that reports releases are not happening — the single
# failure this workflow exists to catch was the failure that disabled it.
# See infra-commons/security#68.

jobs:
  release:
    name: Move moving tags to main
    concurrency:
      # Tag moves are last-write-wins. Serialise them so two pushes cannot race
      # and leave a tag pointing at the older of the two. Scoped to this job so
      # the lock covers the thing that actually takes it.
      #
      # Since every run now releases main's tip (infra-commons/meta#1661),
      # queued runs collapse on their own: GitHub keeps one pending run per
      # group, and whichever runs after a release finds nothing behind and
      # no-ops. `cancel-in-progress` stays false because cancelling a release
      # between its tag pushes is worse than one redundant run.
      group: release-composites
      cancel-in-progress: false
    # `workflow_run` fires on failure too; releasing off a red test run is the
    # one thing this job must never do.
    if: >-
      ${{ github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No approval step, on purpose (since 2026-11-10). Merges to `main` here are
    # made from the operator's own GitHub account; the automation account opens
    # PRs but does not merge them. That merge is the deliberate decision to ship
    # to the fleet, so green Tests after it IS the release. The old
    # `fleet-release` environment approval asked for the same decision a second
    # time. In practice it held a concurrency slot for days and kept every later
    # merge from shipping (2026-09-14→26, 2026-11-07→10).
    #
    # Two things this does NOT give you. First, "only the operator merges" is a
    # practice, not a repo setting: branch protection does not restrict who may
    # merge. Second, Tests (header above) are now the only automated check
    # between a merge and 13+ repos' merge gates. The `fleet-release`
    # environment still exists in repo settings but nothing references it.
    permissions:
      # Corrected 2026-08-22 (reviews/2026-08-22-protect-moving-tags-ruleset-revert.md):
      # this job now mints and pushes as an App installation token, not
      # GITHUB_TOKEN, so the workflow-level `contents: read` above is enough —
      # the actual write authority lives in the minted token below, not here.
      #
      # Why this changed: `protect-moving-tags` (19945090) is meant to restrict
      # `update`/`non_fast_forward` to the App only, matching
      # infra-commons/legal's equivalent ruleset — but GitHub Actions itself
      # cannot be granted a ruleset bypass ("Actor GitHub Actions integration
      # must be part of the ruleset source or owner organization" — a real,
      # live-tested platform limit, infra-commons/security#62). So as long as
      # this job pushed as GITHUB_TOKEN, the ruleset had to keep `update`
      # off, and a `GITHUB_TOKEN` push could force-move `*/v1` on this repo —
      # the exposure infra-commons/security#122 named and fixed on the ruleset
      # side, only for a `GITHUB_TOKEN` release to hit `GH013` on the very
      # next run and get manually (and undocumentedly) reverted hours later.
      #
      # The App-token route this job now takes is not new: it's exactly what
      # infra-commons/legal/.github/workflows/release-legal-review.yml has run
      # successfully in production since 2026-08-15, on an equally public
      # repo, under a ruleset that already restricts `update` to the App. The
      # "this repo is public, so it cannot read the org's private-visibility
      # secrets" reasoning that used to justify GITHUB_TOKEN here didn't hold:
      # `infra-commons/legal` is also public, and `INFRA_COMMONS_BOT_PRIVATE_KEY`
      # is an org secret with `visibility: selected` — a public repo can read
      # a selected-visibility secret once explicitly added to that list; a
      # repo's public/private status was never the actual constraint.
      #
      # This PR ships correctly wired and inert, same as legal's did: its
      # first live run will fail cleanly at the token-mint step until the
      # operator adds infra-commons/security to that secret's
      # selected-repositories list (a deliberate, separate, operator-executed
      # step — see the review doc's runbook). Do not "fix" a failing mint by
      # reverting to GITHUB_TOKEN; the ruleset (once restored, same runbook)
      # will not permit it.
      contents: read
      # Reading the Tests workflow's runs, to confirm main's tip passed when it
      # is not the commit that triggered this run.
      actions: read
    steps:
      - name: Mint an installation token as infra-commons-bot
        # Scoped to exactly this repo and exactly the permission needed to
        # push a tag — least privilege for a token this workflow logs the
        # mint of. `client-id` is a public App identifier, not a secret;
        # `private-key` is.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: Iv23liH9thgSIViTxbMV # gitleaks:allow
          private-key: ${{ secrets.INFRA_COMMONS_BOT_PRIVATE_KEY }}
          owner: infra-commons
          repositories: security
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Minted as the App so every git push below (tag create + moving-tag
          # force-push) is authenticated as the App — the only identity the
          # ruleset lets move `*/v1` once its `update` rule is restored.
          token: ${{ steps.app-token.outputs.token }}
          # Tags and history are the input: the release compares the action
          # directory's tree at HEAD against its tree at the moving tag.
          fetch-depth: 0
          fetch-tags: true
          # main's tip, NOT `workflow_run.head_sha` (infra-commons/meta#1661): an
          # App token without `workflows` cannot tag an older commit whose
          # workflow files differ from main's (run 36792586886). The tests gate
          # lives in the script: a tip that is not the triggering commit is
          # released only on its own green Tests run, and a mid-run push defers.
          ref: main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: "3.12"

      - name: Release any composite whose tag is behind
        id: release
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          # Read-only use: confirming Tests passed on main's tip when it is not
          # the commit that triggered this run. Never used to push.
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/release_composites.py

      - name: Verify every moving tag now matches the released code
        # Skipped only when the release deferred to a newer run, which leaves
        # the tags deliberately behind this checkout; that run verifies them.
        if: ${{ steps.release.outputs.deferred != 'true' }}
        # Separate from the step above on purpose. The release step reporting
        # success is the release mechanism vouching for itself; this re-reads the
        # tags and compares content. A release that reports green without landing
        # is the failure shape this workflow exists to close, so it must not be
        # the same code path that reports it.
        run: python .github/scripts/check_composite_tags_released.py

  verify:
    name: Every moving tag matches main
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Reading this workflow's own run list, for the release-outcome check below.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: "3.12"

      - name: Check every composite is released
        run: python .github/scripts/check_composite_tags_released.py

      - name: Check the last release did not fail
        # The step above proves the tags landed. This one fails if the newest
        # release run failed. A failed release can leave tags half-moved, or
        # leave a family refused for a lagging inner pin. Held or queued runs are
        # named as warnings, not failures. With no approval gate, a held run is
        # transient, and a stale tag behind one still fails the step above.
        #
        # `if: always()` because a stale tag and a failed or held release are
        # usually the same incident, and this step names the *cause*. Skipping
        # it when the check above fails would withhold the diagnosis exactly
        # when it is needed.
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/check_release_not_stuck.py
