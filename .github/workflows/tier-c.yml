name: Security — Tier C (reusable)

# Tier C security gate for static sites, hobby projects, and repos with
# no backend and no secrets in play. Runs a lightweight Gitleaks scan on
# every push. Dependabot is configured separately in dependabot.yml.
#
# Caller pattern (push trigger):
#
#   on:
#     push: {}
#     workflow_dispatch: {}
#
#   jobs:
#     security:
#       uses: infra-commons/security/.github/workflows/tier-c.yml@<SHA>
#       # no secrets needed
#
# The caller workflow must grant:
#   permissions:
#     contents: read
#
# Tier C repos: rolliq-site, cashbucket-site, collective-expertise,
#               workouts (MISCLASSIFIED — see below), bpnz-newsletter, legal, operations
#
# workouts is no longer a no-backend repo. chargingblindly-com/workouts#12 ("feat:
# D1-backed workout history with offline sync", merged 2026-07-30) added a Cloudflare
# Worker (src/index.js), a D1 database binding, and an in-Worker Cloudflare Access gate
# (src/access-guard.js). It is still on Tier C — Gitleaks only, no Semgrep, no Trivy —
# and that gap is real, not intentionally scoped. The old "(until backend added)" caveat
# read as a condition still pending; it was met in Q3 2026 and the tier was never
# revisited. Re-tiering is a live change to that repo's security.yml plus its main
# ruleset's required checks, so it is NOT done here — it is a recommendation.

permissions: {}

on:
  workflow_call:

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --source=/repo --redact --verbose --exit-code=1
