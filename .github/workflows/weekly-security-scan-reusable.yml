name: Weekly security scan (reusable)

# Reusable weekly cadence security scan for solution repos. Replaces the
# duplicated security-scan.yml files that each solution repo previously maintained.
#
# Caller pattern (trigger on schedule and/or workflow_dispatch):
#
#   on:
#     schedule:
#       - cron: '0 2 * * 0'   # Sunday 02:00 UTC
#     workflow_dispatch:
#       inputs:
#         run_ai_review:
#           type: boolean
#           default: false
#
#   concurrency:
#     group: security-scan
#     cancel-in-progress: false
#
#   jobs:
#     weekly-scan:
#       uses: infra-commons/security/.github/workflows/weekly-security-scan-reusable.yml@<SHA>
#       with:
#         run_ai_review: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ai_review || false }}
#         infra_repo: org/infra-repo          # private infra repo for AI infra/cicd review
#         secrets_repo: org/secrets-repo      # private config/PII repo for Gitleaks + AI review
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#         # Either works independently; the App pair is preferred — a PAT expires
#         # silently, an App-minted token cannot. Omit either pair entirely if you
#         # don't set the corresponding repo input above. The App must actually be
#         # installed (Contents:read) on whichever org owns *your* infra_repo /
#         # secrets_repo — these are per-caller inputs, not a fixed shared repo, so
#         # no pre-existing installation covers you automatically.
#         PLATFORM_IAC_TOKEN: ${{ secrets.PLATFORM_IAC_TOKEN }}                 # legacy
#         PLATFORM_IAC_APP_ID: ${{ secrets.PLATFORM_IAC_APP_ID }}
#         PLATFORM_IAC_PRIVATE_KEY: ${{ secrets.PLATFORM_IAC_PRIVATE_KEY }}
#         CLIENTS_CONFIG_TOKEN: ${{ secrets.CLIENTS_CONFIG_TOKEN }}             # legacy
#         CLIENTS_CONFIG_APP_ID: ${{ secrets.CLIENTS_CONFIG_APP_ID }}
#         CLIENTS_CONFIG_PRIVATE_KEY: ${{ secrets.CLIENTS_CONFIG_PRIVATE_KEY }}
#
# The caller workflow must grant:
#   permissions:
#     contents: read
#     issues: write

permissions: {}

on:
  workflow_call:
    inputs:
      run_ai_review:
        description: >-
          Also run the full-codebase adversarial AI review (deep audit — slow,
          noisy on stable code). Opt-in; intended for manual workflow_dispatch.
        type: boolean
        required: false
        default: false
      infra_repo:
        description: >-
          Private infrastructure repo (org/name) checked out under _repos/infra
          for AI infra and CI/CD review chunks. Leave empty to skip those checkouts.
        type: string
        required: false
        default: ""
      secrets_repo:
        description: >-
          Private config/PII repo (org/name) checked out under _repos/secrets for
          Gitleaks full-history scan and AI infra/cicd review. Leave empty to skip.
        type: string
        required: false
        default: ""
      severity_floor:
        description: >-
          Lowest severity to open issues for: CRITICAL | HIGH | MEDIUM | LOW.
          Findings below the floor are dropped and below-floor issues auto-closed.
          Empty defaults to LOW (report everything — historical behaviour).
        type: string
        required: false
        default: ""
    secrets:
      # infra_repo and secrets_repo each have two ways to authenticate their
      # checkout, and the corresponding cred-selection step fails closed unless
      # exactly one is satisfied — but ONLY when that repo input is actually set.
      # Both repos are optional; skip a repo entirely and neither its PAT nor its
      # App pair need be provided.
      ANTHROPIC_API_KEY:
        required: false   # not needed unless run_ai_review is true
      PLATFORM_IAC_TOKEN:
        description: >-
          PAT with Contents:read on the infra repo. Legacy path. Prefer the App
          pair below: a stored token expires, and its expiry is invisible until
          every caller's checkout goes red at once. Not needed unless infra_repo
          is set.
        required: false
      PLATFORM_IAC_APP_ID:
        description: >-
          App ID of a GitHub App installed on infra_repo's org. Used with
          PLATFORM_IAC_PRIVATE_KEY to mint a short-lived, repo-scoped token per
          run, so there is no stored credential to expire. Not needed unless
          infra_repo is set.
        required: false
      PLATFORM_IAC_PRIVATE_KEY:
        description: >-
          Private key matching PLATFORM_IAC_APP_ID. Not needed unless infra_repo
          is set.
        required: false
      CLIENTS_CONFIG_TOKEN:
        description: >-
          PAT with Contents:read on the config repo. Legacy path. Prefer the App
          pair below: a stored token expires, and its expiry is invisible until
          every caller's checkout goes red at once. Not needed unless
          secrets_repo is set.
        required: false
      CLIENTS_CONFIG_APP_ID:
        description: >-
          App ID of a GitHub App installed on secrets_repo's org. Used with
          CLIENTS_CONFIG_PRIVATE_KEY to mint a short-lived, repo-scoped token per
          run, so there is no stored credential to expire. Not needed unless
          secrets_repo is set.
        required: false
      CLIENTS_CONFIG_PRIVATE_KEY:
        description: >-
          Private key matching CLIENTS_CONFIG_APP_ID. Not needed unless
          secrets_repo is set.
        required: false

jobs:
  # ── 1a. Semgrep SAST ────────────────────────────────────────────────────────
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    outputs:
      findings_path: ${{ steps.scan.outputs.findings_path }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep scan (JSON output)
        id: scan
        run: |
          pip install semgrep==1.163.0
          OUTFILE="$RUNNER_TEMP/semgrep-findings.json"
          # --json + || true: findings go to file; non-zero exit is expected on findings
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config .semgrep/ \
            --json \
            --output "$OUTFILE" \
            src/ || true
          echo "findings_path=$OUTFILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: semgrep-findings
          path: ${{ steps.scan.outputs.findings_path }}
          if-no-files-found: ignore
          retention-days: 30

  # ── 1b. Trivy SCA + container scan ─────────────────────────────────────────
  trivy:
    name: SCA + Container (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Trivy severity list from severity_floor
        # Trivy was previously hardwired to HIGH,CRITICAL regardless of
        # severity_floor, so a caller that set (or defaulted to) LOW/MEDIUM
        # was told "report everything" but never got a Trivy MEDIUM or LOW —
        # those columns were structurally always 0 and read as clean when
        # they were never measured (infra-commons/security#96). This
        # deliberately duplicates resolve_severity_floor()'s normalise/
        # validate/default-to-LOW mapping from security-scan.py — this job
        # runs before that action does, in bash, so there's no shared source
        # of truth across the boundary. If the severity vocabulary or the
        # fail-safe default ever changes in one place, change it in the
        # other too, or Trivy silently drifts from the rest of the pipeline.
        id: sev
        env:
          FLOOR: ${{ inputs.severity_floor }}
        run: |
          set -euo pipefail
          # tr -d strips whitespace (including a whitespace-only value) so it
          # falls into the LOW/"" branch below rather than the warning one —
          # matching resolve_severity_floor()'s .strip().upper() in Python.
          floor="$(printf '%s' "$FLOOR" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          case "$floor" in
            CRITICAL) list=CRITICAL ;;
            HIGH)     list=HIGH,CRITICAL ;;
            MEDIUM)   list=MEDIUM,HIGH,CRITICAL ;;
            LOW|"")   list=LOW,MEDIUM,HIGH,CRITICAL ;;
            *)
              echo "::warning::severity_floor='$FLOOR' is not one of CRITICAL|HIGH|MEDIUM|LOW; Trivy will report LOW+ (all severities)."
              list=LOW,MEDIUM,HIGH,CRITICAL
              ;;
          esac
          echo "trivy_severity=$list" >> "$GITHUB_OUTPUT"

      - name: Trivy — filesystem scan (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: ${{ steps.sev.outputs.trivy_severity }}
          exit-code: "0"
          format: json
          output: trivy-fs.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: security-scan-target:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — image scan (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: security-scan-target:latest
          severity: ${{ steps.sev.outputs.trivy_severity }}
          exit-code: "0"
          format: json
          output: trivy-image.json
          ignore-unfixed: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trivy-findings
          path: |
            trivy-fs.json
            trivy-image.json
          if-no-files-found: ignore
          retention-days: 30

  # ── 1c. AI review — application layer (Claude) ─────────────────────────────
  ai-review-app:
    name: AI review — app layer (Claude)
    # Opt-in only — manual dispatch with run_ai_review = true (deep audit).
    if: ${{ inputs.run_ai_review }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: infra-commons/security/.github/actions/weekly-security-scan@weekly-security-scan/v1
        with:
          mode: ai-review
          scan-chunk: app
          provider: anthropic
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          output-path: ${{ runner.temp }}/ai-findings-app.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ai-findings-app
          path: ${{ runner.temp }}/ai-findings-app.json
          if-no-files-found: ignore
          retention-days: 30

  # ── 1d. AI review — infrastructure layer (Claude) ──────────────────────────
  # Previously used GPT-4o, which hit its 30k TPM limit on the 136k-char infra
  # dump. Switched to Claude, which has no such constraint at this scale.
  ai-review-infra:
    name: AI review — infra layer (Claude)
    # Opt-in only — manual dispatch with run_ai_review = true (deep audit).
    if: ${{ inputs.run_ai_review }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # `secrets` is not a context GitHub permits in a step-level `if:` (infra-commons/security#90
    # / #108) — mapping to job-level env here is what makes the credential-mode branches below
    # expressible at all. Do not inline these back into the steps.
    env:
      IAC_APP_ID: ${{ secrets.PLATFORM_IAC_APP_ID }}
      IAC_PRIVATE_KEY: ${{ secrets.PLATFORM_IAC_PRIVATE_KEY }}
      IAC_TOKEN: ${{ secrets.PLATFORM_IAC_TOKEN }}
      CFG_APP_ID: ${{ secrets.CLIENTS_CONFIG_APP_ID }}
      CFG_PRIVATE_KEY: ${{ secrets.CLIENTS_CONFIG_PRIVATE_KEY }}
      CFG_TOKEN: ${{ secrets.CLIENTS_CONFIG_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the infra-repo credential (fail closed)
        id: infra_cred
        if: ${{ inputs.infra_repo != '' }}
        env:
          TARGET_REPO: ${{ inputs.infra_repo }}
        run: |
          set -euo pipefail
          if [ -n "$IAC_APP_ID" ] && [ -n "$IAC_PRIVATE_KEY" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
            echo "Using a GitHub App installation token (minted per run)."
          elif [ -n "$IAC_TOKEN" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            echo "::warning::Using the legacy stored PAT. A stored credential expires; prefer PLATFORM_IAC_APP_ID + PLATFORM_IAC_PRIVATE_KEY."
          else
            echo "::error::infra_repo is set but no infra credential is available: set PLATFORM_IAC_APP_ID AND PLATFORM_IAC_PRIVATE_KEY, or PLATFORM_IAC_TOKEN. Refusing to fail open." >&2
            exit 1
          fi
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${TARGET_REPO##*/}"  >> "$GITHUB_OUTPUT"

      - name: Mint a repo-scoped infra-repo installation token
        id: infra_token
        if: steps.infra_cred.outputs.mode == 'app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.IAC_APP_ID }}
          private-key: ${{ env.IAC_PRIVATE_KEY }}
          owner: ${{ steps.infra_cred.outputs.owner }}
          repositories: ${{ steps.infra_cred.outputs.repo }}

      - name: Check out infra repo
        if: ${{ inputs.infra_repo != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.infra_repo }}
          token: ${{ steps.infra_token.outputs.token || secrets.PLATFORM_IAC_TOKEN }}
          path: _repos/infra

      - name: Select the config-repo credential (fail closed)
        id: cfg_cred
        if: ${{ inputs.secrets_repo != '' }}
        env:
          TARGET_REPO: ${{ inputs.secrets_repo }}
        run: |
          set -euo pipefail
          if [ -n "$CFG_APP_ID" ] && [ -n "$CFG_PRIVATE_KEY" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
            echo "Using a GitHub App installation token (minted per run)."
          elif [ -n "$CFG_TOKEN" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            echo "::warning::Using the legacy stored PAT. A stored credential expires; prefer CLIENTS_CONFIG_APP_ID + CLIENTS_CONFIG_PRIVATE_KEY."
          else
            echo "::error::secrets_repo is set but no config credential is available: set CLIENTS_CONFIG_APP_ID AND CLIENTS_CONFIG_PRIVATE_KEY, or CLIENTS_CONFIG_TOKEN. Refusing to fail open." >&2
            exit 1
          fi
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${TARGET_REPO##*/}"  >> "$GITHUB_OUTPUT"

      - name: Mint a repo-scoped config-repo installation token
        id: cfg_token
        if: steps.cfg_cred.outputs.mode == 'app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.CFG_APP_ID }}
          private-key: ${{ env.CFG_PRIVATE_KEY }}
          owner: ${{ steps.cfg_cred.outputs.owner }}
          repositories: ${{ steps.cfg_cred.outputs.repo }}

      - name: Check out config repo
        if: ${{ inputs.secrets_repo != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.secrets_repo }}
          token: ${{ steps.cfg_token.outputs.token || secrets.CLIENTS_CONFIG_TOKEN }}
          path: _repos/secrets

      - uses: infra-commons/security/.github/actions/weekly-security-scan@weekly-security-scan/v1
        with:
          mode: ai-review
          scan-chunk: infra
          provider: anthropic
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          output-path: ${{ runner.temp }}/ai-findings-infra.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ai-findings-infra
          path: ${{ runner.temp }}/ai-findings-infra.json
          if-no-files-found: ignore
          retention-days: 30

  # ── 1e. AI review — CI/CD layer (Claude) ───────────────────────────────────
  ai-review-cicd:
    name: AI review — CI/CD layer (Claude)
    # Opt-in only — manual dispatch with run_ai_review = true (deep audit).
    if: ${{ inputs.run_ai_review }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # `secrets` is not a context GitHub permits in a step-level `if:` (infra-commons/security#90
    # / #108) — mapping to job-level env here is what makes the credential-mode branches below
    # expressible at all. Do not inline these back into the steps.
    env:
      IAC_APP_ID: ${{ secrets.PLATFORM_IAC_APP_ID }}
      IAC_PRIVATE_KEY: ${{ secrets.PLATFORM_IAC_PRIVATE_KEY }}
      IAC_TOKEN: ${{ secrets.PLATFORM_IAC_TOKEN }}
      CFG_APP_ID: ${{ secrets.CLIENTS_CONFIG_APP_ID }}
      CFG_PRIVATE_KEY: ${{ secrets.CLIENTS_CONFIG_PRIVATE_KEY }}
      CFG_TOKEN: ${{ secrets.CLIENTS_CONFIG_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the infra-repo credential (fail closed)
        id: infra_cred
        if: ${{ inputs.infra_repo != '' }}
        env:
          TARGET_REPO: ${{ inputs.infra_repo }}
        run: |
          set -euo pipefail
          if [ -n "$IAC_APP_ID" ] && [ -n "$IAC_PRIVATE_KEY" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
            echo "Using a GitHub App installation token (minted per run)."
          elif [ -n "$IAC_TOKEN" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            echo "::warning::Using the legacy stored PAT. A stored credential expires; prefer PLATFORM_IAC_APP_ID + PLATFORM_IAC_PRIVATE_KEY."
          else
            echo "::error::infra_repo is set but no infra credential is available: set PLATFORM_IAC_APP_ID AND PLATFORM_IAC_PRIVATE_KEY, or PLATFORM_IAC_TOKEN. Refusing to fail open." >&2
            exit 1
          fi
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${TARGET_REPO##*/}"  >> "$GITHUB_OUTPUT"

      - name: Mint a repo-scoped infra-repo installation token
        id: infra_token
        if: steps.infra_cred.outputs.mode == 'app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.IAC_APP_ID }}
          private-key: ${{ env.IAC_PRIVATE_KEY }}
          owner: ${{ steps.infra_cred.outputs.owner }}
          repositories: ${{ steps.infra_cred.outputs.repo }}

      - name: Check out infra repo
        if: ${{ inputs.infra_repo != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.infra_repo }}
          token: ${{ steps.infra_token.outputs.token || secrets.PLATFORM_IAC_TOKEN }}
          path: _repos/infra

      - name: Select the config-repo credential (fail closed)
        id: cfg_cred
        if: ${{ inputs.secrets_repo != '' }}
        env:
          TARGET_REPO: ${{ inputs.secrets_repo }}
        run: |
          set -euo pipefail
          if [ -n "$CFG_APP_ID" ] && [ -n "$CFG_PRIVATE_KEY" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
            echo "Using a GitHub App installation token (minted per run)."
          elif [ -n "$CFG_TOKEN" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            echo "::warning::Using the legacy stored PAT. A stored credential expires; prefer CLIENTS_CONFIG_APP_ID + CLIENTS_CONFIG_PRIVATE_KEY."
          else
            echo "::error::secrets_repo is set but no config credential is available: set CLIENTS_CONFIG_APP_ID AND CLIENTS_CONFIG_PRIVATE_KEY, or CLIENTS_CONFIG_TOKEN. Refusing to fail open." >&2
            exit 1
          fi
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${TARGET_REPO##*/}"  >> "$GITHUB_OUTPUT"

      - name: Mint a repo-scoped config-repo installation token
        id: cfg_token
        if: steps.cfg_cred.outputs.mode == 'app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.CFG_APP_ID }}
          private-key: ${{ env.CFG_PRIVATE_KEY }}
          owner: ${{ steps.cfg_cred.outputs.owner }}
          repositories: ${{ steps.cfg_cred.outputs.repo }}

      - name: Check out config repo
        if: ${{ inputs.secrets_repo != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.secrets_repo }}
          token: ${{ steps.cfg_token.outputs.token || secrets.CLIENTS_CONFIG_TOKEN }}
          path: _repos/secrets

      - uses: infra-commons/security/.github/actions/weekly-security-scan@weekly-security-scan/v1
        with:
          mode: ai-review
          scan-chunk: cicd
          provider: anthropic
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          output-path: ${{ runner.temp }}/ai-findings-cicd.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ai-findings-cicd
          path: ${{ runner.temp }}/ai-findings-cicd.json
          if-no-files-found: ignore
          retention-days: 30

  # ── 1f. Gitleaks secret scan — config repo (full history) ──────────────────
  gitleaks:
    name: Secret scan — config repo (Gitleaks)
    if: ${{ inputs.secrets_repo != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CFG_APP_ID: ${{ secrets.CLIENTS_CONFIG_APP_ID }}
      CFG_PRIVATE_KEY: ${{ secrets.CLIENTS_CONFIG_PRIVATE_KEY }}
      CFG_TOKEN: ${{ secrets.CLIENTS_CONFIG_TOKEN }}

    steps:
      - name: Select the config-repo credential (fail closed)
        id: cfg_cred
        # No `if:` here — the job-level `if: inputs.secrets_repo != ''` above already
        # guarantees this only runs when a config repo was requested. (Deliberate
        # asymmetry vs. the ai-review jobs, not an oversight.)
        env:
          TARGET_REPO: ${{ inputs.secrets_repo }}
        run: |
          set -euo pipefail
          if [ -n "$CFG_APP_ID" ] && [ -n "$CFG_PRIVATE_KEY" ]; then
            echo "mode=app" >> "$GITHUB_OUTPUT"
            echo "Using a GitHub App installation token (minted per run)."
          elif [ -n "$CFG_TOKEN" ]; then
            echo "mode=pat" >> "$GITHUB_OUTPUT"
            echo "::warning::Using the legacy stored PAT. A stored credential expires; prefer CLIENTS_CONFIG_APP_ID + CLIENTS_CONFIG_PRIVATE_KEY."
          else
            echo "::error::secrets_repo is set but no config credential is available: set CLIENTS_CONFIG_APP_ID AND CLIENTS_CONFIG_PRIVATE_KEY, or CLIENTS_CONFIG_TOKEN. Refusing to fail open." >&2
            exit 1
          fi
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "repo=${TARGET_REPO##*/}"  >> "$GITHUB_OUTPUT"

      - name: Mint a repo-scoped config-repo installation token
        id: cfg_token
        if: steps.cfg_cred.outputs.mode == 'app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ env.CFG_APP_ID }}
          private-key: ${{ env.CFG_PRIVATE_KEY }}
          owner: ${{ steps.cfg_cred.outputs.owner }}
          repositories: ${{ steps.cfg_cred.outputs.repo }}

      - name: Check out config repo (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.secrets_repo }}
          token: ${{ steps.cfg_token.outputs.token || secrets.CLIENTS_CONFIG_TOKEN }}
          fetch-depth: 0
          path: _repos/secrets

      - name: Gitleaks scan (JSON output)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/_repos/secrets:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --source=/repo --redact \
              --report-format json \
              --report-path /repo/gitleaks-findings.json \
              --exit-code 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: gitleaks-findings
          path: _repos/secrets/gitleaks-findings.json
          if-no-files-found: ignore
          retention-days: 30

  # ── 2. Create / close / update GitHub Issues ───────────────────────────────
  create-issues:
    name: Create/close GitHub Issues
    needs: [semgrep, trivy, ai-review-app, ai-review-infra, ai-review-cicd, gitleaks]
    # Run even if earlier jobs failed so partial results are always persisted.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Download all findings artifacts into named subdirectories.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: semgrep-findings
          path: _artifacts/semgrep
        continue-on-error: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-findings
          path: _artifacts/trivy
        continue-on-error: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-findings-app
          path: _artifacts/ai-app
        continue-on-error: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-findings-infra
          path: _artifacts/ai-infra
        continue-on-error: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-findings-cicd
          path: _artifacts/ai-cicd
        continue-on-error: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gitleaks-findings
          path: _artifacts/gitleaks
        continue-on-error: true

      - uses: infra-commons/security/.github/actions/weekly-security-scan@weekly-security-scan/v1
        with:
          mode: create-issues
          github-token: ${{ github.token }}
          repo: ${{ github.repository }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          severity-floor: ${{ inputs.severity_floor }}
          # This job runs under `if: always()` so partial results are persisted —
          # which also means it writes a dashboard on runs where every scanner
          # above it failed. Tell the renderer, or that dashboard is byte-identical
          # to a healthy run's. `skipped` is deliberately NOT degraded: the
          # ai-review jobs and gitleaks are skipped by design on most runs, and a
          # banner that fires on the healthy case is one operators learn to ignore.
          run-degraded: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          semgrep-findings: _artifacts/semgrep/semgrep-findings.json
          trivy-fs-findings: _artifacts/trivy/trivy-fs.json
          trivy-image-findings: _artifacts/trivy/trivy-image.json
          ai-app-findings: _artifacts/ai-app/ai-findings-app.json
          ai-infra-findings: _artifacts/ai-infra/ai-findings-infra.json
          ai-cicd-findings: _artifacts/ai-cicd/ai-findings-cicd.json
          gitleaks-findings: _artifacts/gitleaks/gitleaks-findings.json

  # ── 3. Suppression expiry audit ────────────────────────────────────────────
  suppression-audit:
    name: Suppression expiry audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: infra-commons/security/.github/actions/suppression-audit@suppression-audit/v1
        with:
          github-token: ${{ github.token }}
          repo: ${{ github.repository }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
