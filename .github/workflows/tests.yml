name: Tests

# Runs the unit tests for the composite actions in this repo.
#
# This matters more here than in an ordinary repo: the actions are consumed
# fleet-wide through *moving* version tags (e.g. `adversarial-review/v1`), so a
# regression reaches every caller as soon as the tag advances, with no per-caller
# pin bump to review it first. These tests are the only automated check between
# an edit here and 13+ repos' merge gates.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  adversarial-review:
    name: adversarial-review unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Mirrors the versions the composite action itself installs, so the
        # tests exercise the same SDK surface that runs in production.
        # `hypothesis` is test-only — the action itself does not import it.
        # `anthropic` was missing here even though the action installs it —
        # call_anthropic() only imports it lazily inside the function, so no
        # test exercised that path until security#815 added direct coverage
        # for its truncation guard.
        run: pip install pytest==8.3.4 anthropic==0.49.0 openai==1.75.0 httpx==0.28.1 pyyaml==6.0.2 hypothesis==6.161.8

      - name: Run tests
        # The `ci` hypothesis profile is derandomised (see conftest.py): a
        # property test must never fail a PR that an identical rerun would pass.
        # Broader randomised exploration happens locally under the `dev` profile.
        env:
          HYPOTHESIS_PROFILE: ci
        run: python -m pytest .github/actions/adversarial-review -q

  adversarial-review-gate:
    name: adversarial-review-gate unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # The gate script itself is stdlib-only, deliberately: it is the last
        # thing between a review and a merge. `pyyaml` is test-only, for the
        # assertions that bind the reusable workflow's YAML to this action's
        # input contract.
        run: pip install pytest==8.3.4 pyyaml==6.0.2

      - name: Run tests
        run: python -m pytest .github/actions/adversarial-review-gate -q

  auto-merge-churn:
    name: auto-merge-churn unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # `auto-merge-churn.py` is stdlib-only: it decides which PRs are
        # auto-approved and auto-merged, so it should not be able to break on a
        # dependency resolution.
        run: pip install pytest==8.3.4

      - name: Run tests
        # This action auto-approves and enables auto-merge across 13+ repos, and
        # had no test job at all until infra-commons/security#61 — so its
        # automated release was gated on OTHER families' tests passing, which is
        # not a gate on anything about it.
        run: python -m pytest .github/actions/auto-merge-churn -q

  capture-findings:
    name: capture-findings unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Mirrors the versions the composite action itself installs, so the tests import the
        # same capture.py against the same SDK surface that runs in production. `anthropic`
        # was missing here even though the action installs it — review_diff() only imports
        # it lazily inside the function, so no test exercised that path until security#815
        # added direct coverage for its truncation guard.
        run: pip install pytest==8.3.4 anthropic==0.49.0 httpx==0.28.1 pyyaml==6.0.2

      - name: Run tests
        # These probe the canonical suppressions against `git ls-files`, so the job needs a real
        # work tree — checkout's default depth-1 clone provides one; no history is read.
        run: python -m pytest .github/actions/capture-findings -q

  daily-health-check:
    name: daily-health-check unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Mirrors the version the composite action installs. The action's
        # `anthropic` import is already guarded (falls back to pattern-only
        # diagnosis), so the tests would import without it; pin it anyway so
        # they exercise the same SDK surface that runs in production.
        # `pyyaml` is test-only, same as the sibling jobs above: the tests parse
        # this repo's own reusable workflow to assert the job grants the token
        # scopes the action's reads depend on (infra-commons/meta#1060). The
        # action itself does not import yaml.
        run: pip install pytest==8.3.4 'anthropic==0.49.0' pyyaml==6.0.2

      - name: Run tests
        run: python -m pytest .github/actions/daily-health-check -q

  suppression-audit:
    name: suppression-audit unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Mirrors the versions the composite action itself installs.
        run: pip install pytest==8.3.4 httpx==0.28.1 pyyaml==6.0.2

      - name: Run tests
        # The match check probes patterns against `git ls-files`, so this needs a real work
        # tree — checkout's default depth-1 clone provides one; no history is read. One test
        # asserts this repo's own canonical suppressions are all live, so a PR that adds a
        # dead pattern to that file fails here rather than being found by the weekly audit.
        run: python -m pytest .github/actions/suppression-audit -q

  weekly-security-scan:
    name: weekly-security-scan unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # `security-scan.py` imports httpx at module scope, so importing the module
        # under test needs it even though every network call is monkeypatched out.
        # `anthropic`/`openai` are only imported lazily inside call_claude()/
        # call_gpt4o(), so no test needed them installed until security#815 added
        # direct coverage for their truncation guards (mirrors the identical gap
        # fixed for adversarial-review/capture-findings in the same sweep).
        run: pip install pytest==8.3.4 anthropic==0.49.0 openai==1.75.0 httpx==0.28.1

      - name: Run tests
        # This action can CLOSE issues in every consuming repo, and it had no test
        # job at all until infra-commons/security#65 — where the auto-close pass was
        # found closing hand-filed issues it never opened.
        run: python -m pytest .github/actions/weekly-security-scan -q

  composite-release:
    name: composite release tooling unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The version-numbering tests build throwaway git repos, and the
          # discovery test reads this repo's own `uses:` refs.
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Both scripts are stdlib-only: this tooling decides what reaches the
        # fleet, so it should not be able to break on a dependency resolution.
        run: pip install pytest==8.3.4

      - name: Run tests
        run: python -m pytest .github/scripts -q
